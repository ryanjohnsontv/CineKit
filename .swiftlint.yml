disabled_rules:
  - identifier_name
  - trailing_comma

large_tuple:
  warning: 5
  error: 6

line_length:
  warning: 150
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 20

excluded:
  - "**/.build"
  - "**/.swiftpm"
